<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe8dc">
<title>B&amp;B Preview Demo</title>
<link rel="stylesheet" href="2-style.css">
</head>
<body>
<div class="gift-root">
    <div class="gift-page">
        <span class="gift-testbadge">TEST</span>
        <div class="gift-stage">
            <div class="gift-stage-inner">
                <div class="gift-card-content">
                    <p class="gift-eyebrow">Beispiel</p>
                    <h1 class="gift-heading">Deine Nachricht</h1>
                    <p class="gift-body">Hier steht spaeter Dein persoenlicher Text zum Geschenk.</p>
                    <div class="gift-player" aria-label="Audioplayer">
                        <p class="gift-player-label">Sprachnachricht (Testton)</p>
                        <div class="gift-player-row">
                            <button type="button" class="gift-play" id="playBtn" aria-label="Abspielen">
                                <svg id="iconPlay" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.5v13a1 1 0 0 0 1.52.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
                                <svg id="iconPause" viewBox="0 0 24 24" width="20" height="20" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
                            </button>
                            <div class="gift-track" id="track" role="slider" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                                <div class="gift-track-fill" id="fill"></div>
                            </div>
                            <button type="button" class="gift-mute" id="muteBtn" aria-label="Stumm">
                                <svg id="iconVol" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
                                <svg id="iconMute" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                            </button>
                        </div>
                        <div class="gift-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
                    </div>
                    <button type="button" class="gift-replay" id="replayBtn">Intro erneut ansehen</button>
                </div>
            </div>
        </div>
    </div>

    <div class="gift-overlay" id="overlay" role="button" aria-label="Geschenk oeffnen">
        <img src="4-poster.jpg" alt="" class="gift-media" id="posterImg" draggable="false">
        <video id="video" src="7-intro.mp4" poster="4-poster.jpg" class="gift-media" style="opacity:0" playsinline webkit-playsinline="true" preload="auto"></video>
        <div class="gift-tap-hint" id="tapHint">Tippen zum Oeffnen</div>
    </div>

    <audio id="audio" src="2-sample-audio.mp3" preload="auto"></audio>
</div>
<script src="3-app.js"></script>
</body>
</html>
