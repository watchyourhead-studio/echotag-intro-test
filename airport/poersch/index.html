<!DOCTYPE html>

<head>

<link rel="stylesheet" href="../lib/style.css?v=3">

<body>

    </div>
  </div>

  <p class="subs" aria-live="off"></p>

    <div class="row">
      <button type="button" class="again">Nochmal</button>

  </div>
  <audio id="voice" src="stimme.mp3" preload="auto"></audio>
