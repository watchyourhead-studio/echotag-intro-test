<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E3D6">
<title>Barfuß durch New York – Susanne Kirsch</title>
<meta name="description" content="Susanne Kirsch erzählt, wie ihr persönlichstes New-York-Bild entstanden ist. Ton an und tippen.">
<link rel="preload" href="werk.jpg" as="image">
<link rel="stylesheet" href="../lib/style.css?v=7">
<style>
:root{--bg:#E9E3D6;--ink:#14161c}
/* kein Schleier ueber dem Bild: die Untertitel liegen auf einer kleinen Milchglas-Flaeche */
.scrim.bot{display:none}
.scrim.top{height:16%;background:linear-gradient(rgba(240,235,224,.7),transparent)}
.playing .scrim.top,.ended .scrim.top{opacity:0}
.start .foot{text-shadow:0 0 14px #f3eee2,0 0 30px #f3eee2}
.subs{left:14px;right:14px;padding:11px 14px 12px;border-radius:16px;background:rgba(246,242,234,.80);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);text-shadow:none;box-shadow:0 6px 24px rgba(40,30,20,.10)}
.subs span{opacity:.38}
.end{text-shadow:0 0 12px #f6f1e6,0 0 28px #f6f1e6}
</style>
</head>
<body>
<div class="stage">
  <img class="still" src="werk.jpg" alt="Barfuß durch New York, Susanne Kirsch">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="scrim top"></div><div class="scrim bot"></div>

  <div class="start loading" role="button" tabindex="0" aria-label="Starten">
    <p class="eyebrow">Marniok Art Gallery<b>Airport Club Frankfurt</b></p>
    <div class="foot">
      <p class="artist">Susanne Kirsch</p>
      <h1>Barfuß durch New York</h1>
      <div class="go"><span class="ring"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></span>
        <span>Tippen und zuhören<small>Die Künstlerin erzählt · Ton an</small></span></div>
    </div>
  </div>

  <p class="subs" aria-live="off"></p>
  <div class="bar"><i></i></div>
  <div class="pausehint"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></div>

  <div class="end">
    <p class="t">Barfuß durch New York</p>
    <p class="m">Susanne Kirsch · Malerei und Collage auf Leinwand</p>
    <div class="row">
      <button type="button" class="again">Nochmal</button>
      <a class="fill" href="https://marniokart.com/collections/susanne-kirsch" target="_blank" rel="noopener">Zur Künstlerin</a>
    </div>
  </div>
  <audio id="voice" src="ton.mp3" preload="auto"></audio>
</div>
<script src="../lib/echo.js?v=7"></script>
<script src="szene.js?v=7"></script>
</body>
</html>
