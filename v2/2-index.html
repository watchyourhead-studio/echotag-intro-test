<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0f14">
<title>Intro V2 Test</title>
<link rel="stylesheet" href="2-style.css">
</head>
<body>
<div class="root">
  <div class="stage" id="stage">
    <div class="bg" id="bg"></div>
    <div class="scrim" id="scrim"></div>
    <video id="video" src="6-intro.mp4" poster="4-poster.jpg" class="media" playsinline webkit-playsinline="true" preload="auto"></video>
    <div class="poster" id="poster">
      <img src="4-poster.jpg" alt="" class="media" draggable="false">
      <div class="tap-hint">Tippen zum Oeffnen</div>
      <span class="testbadge">TEST</span>
    </div>

    <div class="card-wrap" id="cardWrap" aria-hidden="true">
      <div class="card" id="card">
        <span class="testbadge card-badge">TEST</span>
        <p class="card-eyebrow anim-item" data-i="0">Beispiel</p>
        <h1 class="card-title anim-item" data-i="1">Deine Sprachnachricht</h1>
        <div class="player anim-item" data-i="2">
          <p class="player-label">Sprachnachricht (Testton)</p>
          <div class="player-row">
            <button type="button" class="play" id="playBtn" aria-label="Abspielen">
              <span class="pulse" aria-hidden="true"></span>
              <svg id="iconPlay" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.5v13a1 1 0 0 0 1.52.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
              <svg id="iconPause" viewBox="0 0 24 24" width="20" height="20" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
            </button>
            <div class="track" id="track" role="slider" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <div class="track-fill" id="fill"></div>
            </div>
            <button type="button" class="mute" id="muteBtn" aria-label="Stumm">
              <svg id="iconVol" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
              <svg id="iconMute" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
        </div>
        <button type="button" class="replay anim-item" data-i="3" id="replayBtn">Intro erneut ansehen</button>
      </div>
    </div>
  </div>
  <audio id="audio" src="7-testton.mp3" preload="auto"></audio>
</div>
<script src="3-app.js"></script>
</body>
</html>
