<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f13685">
<title>Bart &amp; Bastian · Intro V3 Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage" id="stage">
  <img src="2-reveal.jpg" alt="" class="reveal" id="revealPoster" draggable="false">
  <video id="video" src="1-intro.mp4" poster="2-reveal.jpg" class="reveal" playsinline webkit-playsinline="true" muted preload="auto"></video>
  <img src="3-endbild.jpg" alt="" class="endbg" id="endbg" draggable="false">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="fallback" id="fallback" hidden>
    <img src="card-front.jpg" alt="Geschlossene Karte von Bart & Bastian" draggable="false">
  </div>
  <div class="veil" id="veil"></div>
  <div class="taplayer" id="taplayer" role="button" tabindex="0" aria-label="Karte öffnen">
    <span class="testbadge">TEST</span>
    <div class="tap-hint" id="hint">Tippen zum Öffnen</div>
  </div>
  <div class="card-wrap" id="cardWrap" aria-hidden="true">
    <div class="card" id="card">
      <span class="testbadge card-badge">TEST</span>
      <p class="card-eyebrow anim-item" data-i="0">Bart &amp; Bastian</p>
      <h1 class="card-title anim-item" data-i="1">Deine Sprachnachricht</h1>
      <div class="player anim-item" data-i="2">
        <p class="player-label">Sample</p>
        <div class="player-row">
          <button type="button" class="play" id="playBtn" aria-label="Abspielen">
            <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5.5v13a1 1 0 0 0 1.52.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
          </button>
          <div class="track" id="track" role="slider" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div class="track-fill" id="fill"></div>
          </div>
          <button type="button" class="mute" id="muteBtn" aria-label="Stumm">
            <svg id="iconVol" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
            <svg id="iconMute" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <button type="button" class="replay anim-item" data-i="3" id="replayBtn">Intro erneut ansehen</button>
    </div>
  </div>
  <audio id="audio" src="4-testton.mp3" preload="auto"></audio>
</div>
<script src="lib/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
