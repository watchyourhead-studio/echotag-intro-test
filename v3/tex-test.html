<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{width:360px}</style></head><body>
<canvas id="cv" width="1810" height="3200"></canvas>
<script>
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
function loadFonts() {
  var defs = [['400','latin','U+0000-00FF'],['500','latin','U+0000-00FF'],['600','latin','U+0000-00FF'],['500','latin-ext','U+0100-024F, U+1E00-1EFF'],['600','latin-ext','U+0100-024F, U+1E00-1EFF']];
  return Promise.all(defs.map(function(d){
    var f = new FontFace('Oswald','url(fonts/oswald-'+d[0]+'-'+d[1]+'.woff2)',{weight:d[0],unicodeRange:d[2]});
    document.fonts.add(f); return f.load();
  }));
}
var img = new Image();
img.onload = function(){
  loadFonts().then(function(){
    ctx.drawImage(img,0,0,cv.width,cv.height);
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.font='500 60px Oswald';
    ctx.fillText('FÜR', 100, 2400);
    ctx.font='600 184px Oswald';
    ctx.fillText('MAXIMILIAN', 100, 2700);
    document.title='done';
  }, function(e){ document.title='fonterr'; });
};
img.onerror = function(){ document.title='imgerr'; };
img.src='card-front.jpg';
</script></body></html>
