<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1A3D">
<title>Eine Weihnachtsnachricht für dich</title>
<meta name="description" content="Ton an, einmal tippen – und Paris geht für dich in den Abend.">
<!-- Link-Vorschau (WhatsApp, iMessage, Telegram): Crawler fuehren kein JS aus, daher statisch -->
<meta property="og:type" content="website">
<meta property="og:title" content="Eine Weihnachtsnachricht für dich">
<meta property="og:description" content="Ton an, einmal tippen – und Paris geht für dich in den Abend.">
<meta property="og:image" content="https://watchyourhead-studio.github.io/echotag-intro-test/v7b/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="papier.jpg" as="image">
<link rel="preload" href="siegel.png" as="image">
<link rel="stylesheet" href="style.css?v=v7b14">
</head>
<body>
<!-- Zeichen-Filter: Tuschelinien zittern leicht, Aquarell franst aus -->
<svg class="defs" aria-hidden="true" width="0" height="0">
  <filter id="ink" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="8" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation=".5"/>
  </filter>
</svg>

<div class="stage" id="stage">
  <!-- Leeres Kartenpapier sofort sichtbar (auch ohne WebGL); das Canvas legt sich darueber -->
  <img class="still" id="still" src="papier.jpg" alt="">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Umschlag: Rueckseite mit Wachssiegel. Beim Oeffnen bricht das Siegel, die Lasche
       klappt nach oben weg, der Umschlag gleitet nach unten und gibt die Karte frei. -->
  <div class="env" id="env" aria-hidden="true">
    <svg class="env-body" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="envPaper" patternUnits="userSpaceOnUse" width="1080" height="1920">
          <image href="papier.jpg" width="1080" height="1920" preserveAspectRatio="none"/>
        </pattern>
        <filter id="envInk" x="-2%" y="-2%" width="104%" height="104%">
          <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="5" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="envLift" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="-5" stdDeviation="9" flood-color="#3B2A1E" flood-opacity=".2"/>
        </filter>
        <linearGradient id="foldL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8A6A4A" stop-opacity=".02"/>
          <stop offset="1" stop-color="#8A6A4A" stop-opacity=".12"/>
        </linearGradient>
        <linearGradient id="foldR" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#8A6A4A" stop-opacity=".02"/>
          <stop offset="1" stop-color="#8A6A4A" stop-opacity=".12"/>
        </linearGradient>
        <linearGradient id="foldB" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#FFF8EE" stop-opacity=".25"/>
          <stop offset="1" stop-color="#8A6A4A" stop-opacity=".05"/>
        </linearGradient>
      </defs>
      <!-- Seitenlaschen -->
      <path d="M-20 -20 L540 1010 L-20 1940 Z" fill="url(#envPaper)"/>
      <path d="M-20 -20 L540 1010 L-20 1940 Z" fill="url(#foldL)"/>
      <path d="M1100 -20 L540 1010 L1100 1940 Z" fill="url(#envPaper)"/>
      <path d="M1100 -20 L540 1010 L1100 1940 Z" fill="url(#foldR)"/>
      <path d="M0 0 L540 1010 L0 1920 M1080 0 L540 1010 L1080 1920" class="env-ink faint"/>
      <!-- Unterlasche liegt ueber den Seiten -->
      <g filter="url(#envLift)">
        <path d="M-20 1940 L470 1075 Q540 1000 610 1075 L1100 1940 Z" fill="url(#envPaper)"/>
        <path d="M-20 1940 L470 1075 Q540 1000 610 1075 L1100 1940 Z" fill="url(#foldB)"/>
      </g>
      <path d="M0 1920 L470 1075 Q540 1000 610 1075 L1080 1920" class="env-ink"/>
    </svg>
    <div class="env-flap">
      <svg viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
        <defs>
          <filter id="flapShadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3B2A1E" flood-opacity=".28"/>
          </filter>
          <linearGradient id="flapTint" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFF8EE" stop-opacity=".18"/>
            <stop offset="1" stop-color="#8A6A4A" stop-opacity=".08"/>
          </linearGradient>
          <clipPath id="sealL"><path d="M300 830 L548 830 L532 905 L552 960 L528 1010 L556 1066 L534 1120 L550 1240 L300 1240 Z"/></clipPath>
          <clipPath id="sealR"><path d="M548 830 L780 830 L780 1240 L550 1240 L534 1120 L556 1066 L528 1010 L552 960 L532 905 Z"/></clipPath>
        </defs>
        <g filter="url(#flapShadow)">
          <path d="M-20 -20 L1100 -20 L1100 0 L612 1046 Q540 1112 468 1046 L-20 0 Z" fill="url(#envPaper)"/>
          <path d="M-20 -20 L1100 -20 L1100 0 L612 1046 Q540 1112 468 1046 L-20 0 Z" fill="url(#flapTint)"/>
        </g>
        <path d="M0 0 L468 1046 Q540 1112 612 1046 L1080 0" class="env-ink"/>
        <g class="seal">
          <g class="seal-half seal-l" clip-path="url(#sealL)">
            <image href="siegel.png" x="390" y="886" width="300" height="286"/>
            <text class="ini ini-shadow" x="538" y="1027">M</text>
            <text class="ini ini-light" x="542" y="1031">M</text>
            <text class="ini ini-main" x="540" y="1029">M</text>
          </g>
          <g class="seal-half seal-r" clip-path="url(#sealR)">
            <image href="siegel.png" x="390" y="886" width="300" height="286"/>
            <text class="ini ini-shadow" x="538" y="1027">M</text>
            <text class="ini ini-light" x="542" y="1031">M</text>
            <text class="ini ini-main" x="540" y="1029">M</text>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <div class="greeting" id="greeting" aria-live="polite">
    <span class="g-fuer">Für</span>
    <span class="g-name" id="gName"></span>
  </div>

  <div class="topbar">
    <button type="button" class="sound" id="soundBtn" aria-label="Musik aus" hidden>
      <svg class="s-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="s-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="daynight" id="dayNight" aria-label="Tag oder Nacht" hidden>
      <span class="dn-knob" aria-hidden="true"></span>
      <svg class="dn-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="dn-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A7.6 7.6 0 0 1 9.4 4.5a7.6 7.6 0 1 0 10.1 10.1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="taplayer" id="taplayer" role="button" tabindex="0" aria-label="Karte öffnen">
    <div class="start-cues">
      <div class="sound-hint"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6v4h3l4 3V3L5 6H2Z"/><path d="M11 5.5a4 4 0 0 1 0 5M13 3.5a7 7 0 0 1 0 9"/></svg><span>Ton an für das beste Erlebnis</span></div>
      <div class="cta">
        <div class="loading" id="loading" aria-live="polite">
          <span class="loading-text">Karte wird vorbereitet</span>
          <svg viewBox="0 0 160 8" aria-hidden="true">
            <clipPath id="loadClip"><rect id="loadRect" x="0" y="-6" width="0" height="20"/></clipPath>
            <path d="M2 4 C 40 3, 80 5.2, 120 3.8 S 150 4.4, 158 4" class="ll-base"/>
            <g clip-path="url(#loadClip)"><path d="M2 4 C 40 3, 80 5.2, 120 3.8 S 150 4.4, 158 4" class="ll-ink"/></g>
          </svg>
        </div>
        <div class="open-btn" id="hint">
          <svg class="open-edge" viewBox="0 0 200 50" preserveAspectRatio="none" aria-hidden="true">
            <rect x="2" y="2" width="196" height="46" rx="23" class="edge-a"/>
            <rect x="3.4" y="3" width="193.6" height="44.4" rx="22" class="edge-b"/>
          </svg>
          <span>Karte öffnen</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card-wrap" id="cardWrap" aria-hidden="true">
    <!-- Player wie mit Feder und Aquarell auf das Kartenpapier gezeichnet -->
    <div class="card" id="card">
      <svg class="card-edge" viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true">
        <rect x="2" y="2" width="296" height="76" rx="16" class="edge-a"/>
        <rect x="3.2" y="2.8" width="294" height="74.6" rx="15" class="edge-b"/>
      </svg>
      <button type="button" class="play" id="playBtn" aria-label="Abspielen">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="21" class="play-wash"/>
          <circle cx="28" cy="28" r="23.5" class="play-ring"/>
          <path id="iconPlay" d="M23 19.5 L37.5 28 L23 36.5 Z" class="play-icon"/>
          <g id="iconPause" class="play-icon" style="display:none"><path d="M22.5 19.5v17M33.5 19.5v17"/></g>
        </svg>
      </button>
      <div class="card-body">
        <p class="card-eyebrow">EchoTag</p>
        <h1 class="card-title">Deine Sprachnachricht</h1>
        <div class="track-row">
          <div class="track" id="track" role="slider" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <svg viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true">
              <path d="M3 8 C 40 6.2, 75 9.4, 110 7.4 S 170 6.6, 197 7.8" pathLength="100" class="track-line"/>
              <clipPath id="fillClip"><rect id="fillRect" x="0" y="-10" width="0" height="34"/></clipPath>
              <g clip-path="url(#fillClip)"><path id="fill" d="M3 8 C 40 6.2, 75 9.4, 110 7.4 S 170 6.6, 197 7.8" class="track-fill"/></g>
            </svg>
          </div>
          <span class="time" id="tCur">0:00</span>
        </div>
      </div>
    </div>
    <div class="after">
      <a class="gift" id="giftLink" href="#" target="_blank" rel="noopener">Selbst eine EchoTag-Karte verschenken</a>
      <button type="button" class="replay" id="replayBtn">Nochmal erleben</button>
    </div>
  </div>

  <!-- Schnee vor allem, auch vor dem Player, damit er sich darauf sammeln kann -->
  <canvas id="snow" aria-hidden="true"></canvas>

  <audio id="voice" src="nachricht.mp3" preload="auto"></audio>
</div>
<script src="app.js?v=v7b14"></script>
</body>
</html>
